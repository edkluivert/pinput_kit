name: pinput_kit_example
description: "pinput_kit example: an OTP verification screen on native fields."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0-192.0.dev

# Plain version deps: `dn pub get` resolves DartNative packages from your
# installed SDK (closed resolution) — no registry setup, works offline.
dependencies:
  pinput_kit:
    path: ../
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  dartnative_skia: ^1.0.0

dev_dependencies:
  lints: ^6.0.0


dartnative_skia:
  variant: full
